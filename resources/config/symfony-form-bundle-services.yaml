# Reuses Symfony's Twig environment through the shared Derafu renderer.
# Both form implementations keep their normal form_* function names.
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # A Twig extension is a tagged framework entry point, registered by class.
    Derafu\Form\Renderer\FormTwigExtension:
        arguments:
            $renderer: '@Derafu\Form\Contract\Renderer\FormRendererInterface'
            $charset: 'UTF-8'
        tags: [twig.extension]

    Derafu\FormBundle\Twig\FormIntegrationExtension:
        tags: [twig.extension]

    Derafu\Twig\Contract\TwigServiceInterface:
        class: Derafu\Twig\Service\TwigService
        # Defers access to the same native environment until rendering starts:
        # Twig -> Form extension -> Form renderer -> Renderer -> Twig service.
        lazy: true
        arguments:
            $twig: '@twig'

    # FormPathsPass supplies bundle paths first and the application's path last.
    Derafu\Form\Contract\Loader\FormLoaderInterface:
        class: Derafu\Form\Loader\PhpFormLoader
        arguments:
            $paths: []
